<!DOCTYPE html>
<html lang="ca">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboMón · Projecció</title>
<style>
/*@@FONTS@@*/
:root { --tinta: #1c2733; --suau: #4b5866; --fons: #f5efe4; --vora: #e3d9c6; --verd: #2c7650; --daurat: #d9a441;
  --ombra: 0 1px 2px rgba(28, 39, 51, .06), 0 14px 34px -14px rgba(28, 39, 51, .3);
  --lletra: "Lexend", "Atkinson Hyperlegible", Verdana, "Segoe UI", Arial, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font-family: var(--lletra); color: var(--tinta); background: var(--fons); }
b, h1, h2 { font-weight: 600; }
[hidden] { display: none !important; }
svg { display: block; width: 100%; height: 100%; }
.pant { height: 100vh; display: flex; flex-direction: column; padding: 3vh 3vw; gap: 2.4vh; }
.dalt { display: flex; align-items: center; gap: 2vw; }
.dalt .illa { width: 17vh; height: 12.75vh; flex: 0 0 auto; border-radius: 2vh; overflow: hidden; box-shadow: var(--ombra); }
.illa-retall { width: 100%; height: 100%; background-repeat: no-repeat; }
.dalt h1 { font-size: 6vh; margin: 0; line-height: 1.1; }
.dalt .sub { font-size: 3.2vh; color: var(--suau); font-weight: 700; }
.rellotge { margin-left: auto; font-size: 7vh; font-weight: 700; }
.frase { font-size: 5.4vh; font-weight: 700; margin: 0; line-height: 1.2; }
.nivells { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2vw; flex: 1 1 auto; min-height: 0; }
.nivell { background: #fffdf8; box-shadow: var(--ombra); border-radius: 3vh; padding: 2.4vh 2vw; display: flex; flex-direction: column; gap: 1.6vh; }
.nivell .num { font-size: 4vh; font-weight: 700; }
.nivell p { font-size: 3.6vh; margin: 0; line-height: 1.25; }
.nivell .il { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; }
.nivell .il svg, .nivell .il img { width: auto; height: 100%; max-height: 30vh; border-radius: 2vh; }
.baix { display: flex; align-items: center; gap: 2vw; }
.far { flex: 1 1 auto; display: flex; align-items: center; gap: 1.6vw; background: #fffdf8; box-shadow: var(--ombra); border-radius: 3vh; padding: 1.6vh 2vw; }
.far .etiq { font-size: 3.4vh; font-weight: 700; white-space: nowrap; }
.metre { flex: 1 1 auto; height: 3vh; border-radius: 1.5vh; background: #ece3cf; position: relative; overflow: hidden; }
.metre span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 1.5vh; background: var(--daurat); transition: width 1s ease; }
.codi { background: #f6e7c4; border: 3px solid var(--daurat); border-radius: 3vh; padding: 1.6vh 2vw; font-size: 4vh; font-weight: 700; }
.gran { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; text-align: center; }
.gran h1 { font-size: 9vh; margin: 0; }
.gran p { font-size: 5vh; margin: 0; }
.peu { font-size: 2.4vh; color: var(--suau); text-align: right; }
</style>
</head>
<body>
<div class="pant" id="pant">
  <div class="dalt">
    <div class="illa" id="illa"></div>
    <div><h1 id="titol">RoboMón</h1><div class="sub" id="sub"></div></div>
    <div class="rellotge" id="rellotge"></div>
  </div>
  <div id="treball" hidden style="display:flex; flex-direction:column; gap:2.4vh; flex:1 1 auto; min-height:0;">
    <p class="frase" id="frase"></p>
    <div class="nivells">
      <div class="nivell"><span class="num">Nivell 1</span><p id="n1"></p><div class="il" id="il1"></div></div>
      <div class="nivell"><span class="num">Nivell 2</span><p id="n2"></p><div class="il" id="il2"></div></div>
      <div class="nivell"><span class="num">Nivell 3</span><p id="n3"></p><div class="il" id="il3"></div></div>
    </div>
  </div>
  <div class="gran" id="sortida" hidden><h1>Targeta de sortida</h1><p>Obre el Chromebook i respon les preguntes.</p></div>
  <div class="gran" id="buida" hidden><h1>RoboMón</h1><p>Encara no hi ha cap sessió oberta.</p></div>
  <div class="baix" id="baix" hidden>
    <div class="far"><span class="etiq" id="far-text"></span><div class="metre"><span id="far-metre"></span></div></div>
    <div class="codi" id="codi" hidden></div>
  </div>
</div>
<script>
/*@@IL@@*/
</script>
<script>
'use strict';
/* Aquesta pantalla NOMÉS rep dades agregades del servidor: no pot mostrar cap nom. */
const $ = id => document.getElementById(id);
function rellotge() {
  const d = new Date();
  $('rellotge').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function pinta(p) {
  $('treball').hidden = !p.oberta || p.estat !== 'oberta';
  $('sortida').hidden = !p.oberta || p.estat !== 'sortida';
  $('buida').hidden = !!p.oberta;
  $('baix').hidden = !p.oberta;
  if (!p.oberta) { $('titol').textContent = 'RoboMón'; $('sub').textContent = ''; $('illa').innerHTML = ''; return; }
  $('titol').textContent = p.zona + ' · ' + p.titol;
  $('sub').textContent = p.eina;
  const i = Number(String(p.sessio).slice(1)) - 1;
  $('illa').innerHTML = illaHTML(i, 'n1');
  $('frase').textContent = p.frase;
  $('n1').textContent = p.nivells.n1 || '';
  $('n2').textContent = p.nivells.n2 || '';
  $('n3').textContent = p.nivells.n3 || '';
  ['1', '2', '3'].forEach(k => { const im = (p.imatges || {})['n' + k]; $('il' + k).innerHTML = im && IL[im] ? IL[im] : ''; });
  $('far-text').textContent = p.fita.assolida ? 'El far del grup és encès! ✓' : 'El far del grup: ' + p.fita.ambN2 + ' de ' + p.fita.objectiu + ' amb nivell 2';
  $('far-metre').style.width = Math.min(100, Math.round(p.fita.ambN2 / Math.max(1, p.fita.objectiu) * 100)) + '%';
  $('codi').hidden = !p.codi;
  $('codi').textContent = 'Codi: ' + p.codi;
}
function carrega() {
  google.script.run.withSuccessHandler(r => { if (r && r.ok) pinta(r.dades); }).api('projeccio', {});
}
rellotge(); setInterval(rellotge, 15000);
carrega(); setInterval(carrega, 15000);
</script>
</body>
</html>
